<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Heart Disease Prediction</h1>

        <p class="subtitle">
            Enter the patient's information to generate a model prediction.
        </p>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120"
                        required>
                </div>

                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="sex" required>
                        <option value="">Select</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="chest_pain">Chest Pain Type</label>
                    <select id="chest_pain"
                            name="chest_pain"
                            required>
                        <option value="">Select</option>
                        <option value="ATA">Atypical Angina</option>
                        <option value="ASY">Asymptomatic</option>
                        <option value="NAP">Non-Anginal Pain</option>
                        <option value="TA">Typical Angina</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resting_bp">
                        Resting Blood Pressure
                    </label>

                    <input
                        type="number"
                        id="resting_bp"
                        name="resting_bp"
                        min="50"
                        max="250"
                        required>
                </div>

                <div class="form-group">
                    <label for="cholesterol">
                        Cholesterol
                    </label>

                    <input
                        type="number"
                        id="cholesterol"
                        name="cholesterol"
                        min="50"
                        max="700"
                        required>
                </div>

                <div class="form-group">
                    <label for="fasting_bs">
                        Fasting Blood Sugar
                    </label>

                    <select id="fasting_bs"
                            name="fasting_bs"
                            required>

                        <option value="">Select</option>
                        <option value="0">
                            No (≤ 120 mg/dl)
                        </option>

                        <option value="1">
                            Yes (> 120 mg/dl)
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resting_ecg">
                        Resting ECG
                    </label>

                    <select id="resting_ecg"
                            name="resting_ecg"
                            required>

                        <option value="">Select</option>
                        <option value="Normal">Normal</option>
                        <option value="ST">
                            ST-T Wave Abnormality
                        </option>

                        <option value="LVH">
                            Left Ventricular Hypertrophy
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="max_hr">
                        Maximum Heart Rate
                    </label>

                    <input
                        type="number"
                        id="max_hr"
                        name="max_hr"
                        min="50"
                        max="250"
                        required>
                </div>

                <div class="form-group">
                    <label for="exercise_angina">
                        Exercise-Induced Angina
                    </label>

                    <select id="exercise_angina"
                            name="exercise_angina"
                            required>

                        <option value="">Select</option>
                        <option value="N">No</option>
                        <option value="Y">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="oldpeak">
                        Oldpeak
                    </label>

                    <input
                        type="number"
                        id="oldpeak"
                        name="oldpeak"
                        min="0"
                        max="10"
                        step="0.1"
                        required>
                </div>

                <div class="form-group">
                    <label for="st_slope">
                        ST Slope
                    </label>

                    <select id="st_slope"
                            name="st_slope"
                            required>

                        <option value="">Select</option>
                        <option value="Up">Upsloping</option>
                        <option value="Flat">Flat</option>
                        <option value="Down">Downsloping</option>
                    </select>
                </div>

            </div>

            <button type="submit">
                Predict
            </button>

        </form>

        <div class="disclaimer">
            <strong>Disclaimer:</strong>
            This application provides a machine-learning prediction
            based on the information entered. It is not a medical
            diagnosis and should not be used as a substitute for
            professional medical advice.
        </div>

    </div>

</div>

</body>

</html>
