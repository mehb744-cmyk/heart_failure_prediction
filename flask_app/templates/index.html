<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>
</head>

<body>

    <h1>Heart Disease Prediction</h1>

    <form action="/predict" method="POST">

        <label>Age:</label>
        <input type="number" name="age" min="1" max="120" required>
        <br><br>

        <label>Sex:</label>
        <select name="sex" required>
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>
        <br><br>

        <label>Chest Pain Type:</label>
        <select name="chest_pain" required>
            <option value="ATA">Atypical Angina</option>
            <option value="ASY">Asymptomatic</option>
            <option value="NAP">Non-Anginal Pain</option>
            <option value="TA">Typical Angina</option>
        </select>
        <br><br>

        <label>Resting Blood Pressure:</label>
        <input type="number" name="resting_bp" min="50" max="250" required>
        <br><br>

        <label>Cholesterol:</label>
        <input type="number" name="cholesterol" min="50" max="700" required>
        <br><br>

        <label>Fasting Blood Sugar:</label>
        <select name="fasting_bs" required>
            <option value="0">No (≤ 120 mg/dl)</option>
            <option value="1">Yes (> 120 mg/dl)</option>
        </select>
        <br><br>

        <label>Resting ECG:</label>
        <select name="resting_ecg" required>
            <option value="Normal">Normal</option>
            <option value="ST">ST-T Wave Abnormality</option>
            <option value="LVH">Left Ventricular Hypertrophy</option>
        </select>
        <br><br>

        <label>Maximum Heart Rate:</label>
        <input type="number" name="max_hr" min="50" max="250" required>
        <br><br>

        <label>Exercise-Induced Angina:</label>
        <select name="exercise_angina" required>
            <option value="N">No</option>
            <option value="Y">Yes</option>
        </select>
        <br><br>

        <label>Oldpeak:</label>
        <input type="number"
               name="oldpeak"
               min="0"
               max="10"
               step="0.1"
               required>
        <br><br>

        <label>ST Slope:</label>
        <select name="st_slope" required>
            <option value="Up">Upsloping</option>
            <option value="Flat">Flat</option>
            <option value="Down">Downsloping</option>
        </select>
        <br><br>

        <button type="submit">Predict</button>

    </form>

</body>

</html>
